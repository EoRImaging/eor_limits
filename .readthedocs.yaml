# Read the Docs configuration
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # LaTeX for the publication-style plots in the tutorial, which use text.usetex
  # with the newtx fonts
  apt_packages:
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-fonts-extra
    - cm-super
    - dvipng
  # Install the package and its docs dependencies from uv.lock
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --group docs

sphinx:
  configuration: docs/source/conf.py
