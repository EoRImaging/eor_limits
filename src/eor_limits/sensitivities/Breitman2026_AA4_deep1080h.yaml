notes:
    - Forecast 1-sigma sensitivity of the SKA-Low AA4 layout (512 stations), computed with 21cmSense for the SKA forecasts of Breitman et al. 2026 (arXiv:2606.00219, accepted by A&A).
    - Deep survey of one field tracked for 6 hours per day over 180 days (1080 hours), moderate foreground avoidance, baselines up to 1 km, Planck15 cosmology (h = 0.6774), 8 MHz bands centred on 50, 60, 80, 120, 125, 140, 160, 180, 200, 215 MHz.
    - The sensitivity includes thermal noise and sample variance. The sample variance is computed for the mock 21cmEMUv3 signal of the paper. k bins without sensitivity are set to .inf.
    - Converted from SKA_v3_AA4.npz in 21CMMC (sensitivity = square root of the stored variance).

